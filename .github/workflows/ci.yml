# The gate (DESIGN.md §9): biome + tsc + vitest (unit/property/contract vs the
# sqlite driver) + vitest-pool-workers (contract vs D1 in workerd). The contract
# suite running against BOTH storage drivers is the matrix that stops the two
# deployment adapters drifting apart silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Surfaced as env because the `secrets` context is NOT available in an `if:`
    # expression — referencing it there makes the whole workflow unparseable, so
    # every run startup-fails in 0s and no checks attach to the PR at all. The
    # `env` context IS available in a step `if:`, so the skip-when-unset
    # behaviour below works as originally intended.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Coverage visibility (PR graphs/comments). The GATE is the vitest
      # thresholds above — this upload is informational and skipped until the
      # CODECOV_TOKEN secret exists.
      - uses: codecov/codecov-action@v5
        if: env.CODECOV_TOKEN != ''
        with:
          files: coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}

  gitleaks:
    # Secret scanning in CI from day one (DESIGN.md §18).
    #
    # Runs the gitleaks IMAGE directly rather than gitleaks-action@v2: the
    # scanner is free and open source, but the v2 Action wrapper requires a paid
    # licence for organisation accounts and hard-fails without one ("[whendowe]
    # is an organization. License key is required."). That is why this job was
    # red on every run from M0 until now — the scan never executed.
    #
    # --redact keeps a finding's value out of the CI log (§13/§14: secrets never
    # reach logs). gitleaks exits 1 when it finds anything, which fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `gitleaks git` walks history, not just the tip — a secret that was
          # committed and later removed is still in the history that goes public.
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact
