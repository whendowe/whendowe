# The gate (DESIGN.md §9): biome + tsc + vitest (unit/property/contract vs the
# sqlite driver) + vitest-pool-workers (contract vs D1 in workerd). The contract
# suite running against BOTH storage drivers is the matrix that stops the two
# deployment adapters drifting apart silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Surfaced as env because the `secrets` context is NOT available in an `if:`
    # expression — referencing it there makes the whole workflow unparseable, so
    # every run startup-fails in 0s and no checks attach to the PR at all. The
    # `env` context IS available in a step `if:`, so the skip-when-unset
    # behaviour below works as originally intended.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Coverage visibility (PR graphs/comments). The GATE is the vitest
      # thresholds above — this upload is informational and skipped until the
      # CODECOV_TOKEN secret exists.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: env.CODECOV_TOKEN != ''
        with:
          files: coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}

  browser:
    # The browser tier (DESIGN §9 rc16–rc17): the pages' own scripts in Chromium, JS on
    # and off, every driven state compared with its committed reference screenshot, the
    # poll picker's state machine at gate budget, and the picker's coverage.
    # Runs in the pinned Playwright image — the same one scripts/browser.sh uses —
    # because references are only comparable when fonts come from the same image.
    # Keep the digest in step with @playwright/test in package.json.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:browser:run
        env:
          HOME: /root
          # A full run: the picker's coverage must meet its thresholds (rc17).
          COVERAGE_THRESHOLDS: "1"
      # On a visual change: expected / actual / diff images for each failing state.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-diffs
          path: tests/browser/test-results/
          retention-days: 14
      # The picker's coverage as lcov, from every run, passing or not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-coverage
          path: tests/browser/coverage/
          retention-days: 14
          if-no-files-found: ignore

  gitleaks:
    # Secret scanning in CI from day one (DESIGN.md §18).
    #
    # Runs the gitleaks IMAGE directly rather than gitleaks-action@v2: the
    # scanner is free and open source, but the v2 Action wrapper requires a paid
    # licence for organisation accounts and hard-fails without one ("[whendowe]
    # is an organization. License key is required."). That is why this job was
    # red on every run from M0 until now — the scan never executed.
    #
    # --redact keeps a finding's value out of the CI log (§13/§14: secrets never
    # reach logs). gitleaks exits 1 when it finds anything, which fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks git` walks history, not just the tip — a secret that was
          # committed and later removed is still in the history that goes public.
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact
