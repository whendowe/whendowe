# Publish, not deploy (DESIGN.md §18): this repo's CI never deploys — it publishes
# versioned artifacts. main → ghcr image and Worker bundle tagged with the
# branch/sha; tag v* → release-tagged image and bundle. Deployment happens exclusively from the private
# whendowe/deployments registry, which pins these artifacts.
# (Named deploy.yml per the §8 skeleton; its semantics are §18's publish step.)
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/node/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-worker:
    # The Worker bundle as an OCI artifact (DESIGN.md §18, rc14). The deployments
    # repo pins it BY DIGEST and deploys it with `no_bundle`, so what runs on an
    # instance is exactly what was built here — it never builds from source and
    # needs no access to this repo. Contents (`npm run build:worker`):
    #   bundle/                  wrangler's dry-run bundle (+ source map)
    #   migrations/*.sql         the migrations this commit's code expects
    #   wrangler.template.jsonc  bindings, Durable Object classes + tags, crons
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      # The oras CLI image rather than a third-party setup action, as with
      # gitleaks in ci.yml. The token goes in on stdin and is never stored.
      - name: Push the bundle to ghcr
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}-worker"
          tags=$(printf '%s\n' "$TAGS" | sed 's/.*://' | paste -sd, -)
          digest=$(printf '%s' "$GH_TOKEN" | docker run --rm -i \
            -v "$PWD/dist/worker:/workspace" -w /workspace \
            ghcr.io/oras-project/oras:v1.3.4 push \
            --username "$GITHUB_ACTOR" --password-stdin \
            --format json \
            --artifact-type application/vnd.whendowe.worker.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${image}:${tags}" \
            bundle migrations wrangler.template.jsonc | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::push returned no digest"; exit 1 ;; esac
          echo "Pin: \`${image}@${digest}\` (tags: ${tags})" >> "$GITHUB_STEP_SUMMARY"
