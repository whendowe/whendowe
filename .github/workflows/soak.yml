# Nightly long-budget property/simulation run (DESIGN.md §9 gate-vs-soak split).
# Any failure found here gets its shrunken counterexample pinned as a regression
# test that then runs in the fast gate (AGENTS.md).
name: Soak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run soak
