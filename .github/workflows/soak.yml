# Nightly long-budget property/simulation run (DESIGN.md §9 gate-vs-soak split).
# Any failure found here gets its shrunken counterexample pinned as a regression
# test that then runs in the fast gate (AGENTS.md).
name: Soak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run soak
