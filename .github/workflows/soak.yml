# Nightly long-budget property/simulation run (DESIGN.md §9 gate-vs-soak split).
# Any failure found here gets its shrunken counterexample pinned as a regression
# test that then runs in the fast gate (AGENTS.md).
name: Soak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run soak

  soak-browser:
    # The poll picker's state machine at soak budget (DESIGN §9 rc17), in the same
    # pinned Playwright image as CI's browser job. A failure's shrunken sequence of
    # actions goes into REGRESSIONS in tests/browser/poll-machine.spec.ts.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea # v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:browser:run -- --grep @machine
        env:
          HOME: /root
          SOAK: "1"
